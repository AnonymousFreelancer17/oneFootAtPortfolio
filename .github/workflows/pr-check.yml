name: 🧪 PR Quality Check

on:
  pull_request:
    branches: [main, dev]

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint and Test
        run: |
          npx nx lint
          npx nx test
